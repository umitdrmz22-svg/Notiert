name: Android build
on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        description: Build output
        options: [test-apk, signed-play-aab]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - if: inputs.package == 'test-apk'
        run: gradle --no-daemon assembleDebug
      - if: inputs.package == 'signed-play-aab'
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          : "${KEY_B64:?Missing keystore}" "${ANDROID_KEYSTORE_PASSWORD:?Missing store password}" "${ANDROID_KEY_ALIAS:?Missing key alias}" "${ANDROID_KEY_PASSWORD:?Missing key password}"
          export UPLOAD_STORE="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$UPLOAD_STORE"' EXIT
          printf '%s' "$KEY_B64" | base64 --decode > "$UPLOAD_STORE"
          gradle --no-daemon bundleRelease
          jarsigner -verify -verbose app/build/outputs/bundle/release/app-release.aab | grep -F 'jar verified.'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 1
