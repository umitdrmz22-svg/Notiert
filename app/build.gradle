plugins { id 'com.android.application' }
android {
    namespace 'de.defidev.notiert'
    compileSdk 36
    testOptions.unitTests.includeAndroidResources = true
    defaultConfig {
        applicationId 'de.defidev.notiert'
        minSdk 26
        targetSdk 36
        manifestPlaceholders = [launcherLabel: 'Notiert']
        versionCode 2
        versionName '0.2.0'
    }
    signingConfigs {
        if (System.getenv('UPLOAD_STORE')) {
            upload {
                storeFile file(System.getenv('UPLOAD_STORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix providers.gradleProperty('previewSuffix').getOrElse('.preview')
            if (providers.gradleProperty('previewSuffix').getOrElse('') == '.preview2')
                manifestPlaceholders.launcherLabel = 'Notiert 0.2'
        }
        release { if (System.getenv('UPLOAD_STORE')) signingConfig signingConfigs.upload }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
}
